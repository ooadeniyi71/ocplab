apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clusterinstance-ocp4lab1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ooadeniyi71/ocplab.git
    targetRevision: main
    path: acm-clusterinstance
    helm:
      releaseName: clusterinstance-ocp4lab1
      values: |
        cluster:
          name: "ocplab1"
          namespace: "ocplab1-spoke"
          environment: "homelab"
          syncWave: "2"
        clusterSpec:
          baseDomain: "attlocal.net"
          networkType: "OVNKubernetes"
          holdInstallation: false
          clusterImageSetNameRef: "openshift-4.14"
          pullSecretName: "pullsecret-cluster"
          sshPublicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILoWADe8rTQcIoSN3P+zruSE8lLYu/9UDhSchk+9yU4B root@fedora"
          vipAPI: "10.218.1.118"
          ingressAPI: "10.218.1.119"
          additionalNTPSources:
            - "8.8.8.8"
            - "1.1.1.1"
        clusterLabels:
          cloud: "BareMetal"
          tier: "cdf"
          site: "ocplab1"
          clusterset: "homelab"
        network:
          cluster:
            cidr: "10.128.0.0/14"
            hostPrefix: 23
          service:
            - cidr: "172.30.0.0/16"
          machine:
            - cidr: "10.218.1.0/24"
        templateRefs:
          cluster:
            - name: "ai-cluster-templates-v1"
              namespace: "ocplab1-spoke"
          node:
            - name: "ai-node-templates-v1"
              namespace: "ocplab1-spoke"
        networkDefaults:
          interfaceName: "ens18"
          ipv4:
            enabled: true
            prefixLength: 22
            dhcp: false
          dns:
            servers:
              - "10.218.1.206"
              - "10.218.1.1"
          gateway:
            address: "10.218.1.1"
            routeTableId: "254"
        masterNodes:
          - name: "dell1-m1"
            hostname: "dell1-m1.ocplab1.attlocal.net"
            bmcAddress: "redfish-virtualmedia+https://10.218.1.111/redfish/v1/System"
            bmcCredentialsName: "bmc-secret"
            bootMAC: "BC:24:11:5A:F3:A6"
            interfaceMAC: "BC:24:11:5A:F3:A6"
            ipAddress: "10.218.1.111"
            rootDevice: "/dev/sda"
            bootMode: "UEFI"
          - name: "dell1-m2"
            hostname: "dell1-m2.ocplab1.attlocal.net"
            bmcAddress: "redfish-virtualmedia+https://10.218.1.112/redfish/v1/System"
            bmcCredentialsName: "bmc-secret"
            bootMAC: "BC:24:11:91:DF:02"
            interfaceMAC: "BC:24:11:91:DF:02"
            ipAddress: "10.218.1.112"
            rootDevice: "/dev/sda"
            bootMode: "UEFI"
          - name: "dell1-m3"
            hostname: "dell1-m3.ocplab1.attlocal.net"
            bmcAddress: "redfish-virtualmedia+https://10.218.1.113/redfish/v1/System"
            bmcCredentialsName: "bmc-secret"
            bootMAC: "BC:24:11:6C:CD:05"
            interfaceMAC: "BC:24:11:6C:CD:05"
            ipAddress: "10.218.1.113"
            rootDevice: "/dev/sda"
            bootMode: "UEFI"
        workerNodes:
          - name: "dell1-w1"
            hostname: "dell1-w1.ocplab1.attlocal.net"
            bmcAddress: "redfish-virtualmedia+https://10.218.1.114/redfish/v1/System"
            bmcCredentialsName: "bmc-secret"
            bootMAC: "BC:24:11:70:D1:B6"
            interfaceMAC: "BC:24:11:70:D1:B6"
            ipAddress: "10.218.1.114"
            rootDevice: "/dev/sda"
            bootMode: "UEFI"
        bootConfig:
          mode: "UEFI"
  destination:
    server: https://kubernetes.default.svc
    namespace: ocplab1-spoke
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
